<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ShapeShift</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <span class="backdrop-glow"></span>
    <span class="backdrop-grid"></span>
  </div>

  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="20" height="20" fill="none">
            <defs>
              <linearGradient id="ssMarkPopup" x1="6" y1="3" x2="26" y2="29" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#7dd3fc"/>
                <stop offset=".55" stop-color="#6d8bff"/>
                <stop offset="1" stop-color="#a78bfa"/>
              </linearGradient>
              <linearGradient id="ssRingPopup" x1="8" y1="8" x2="88" y2="88" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#7dd3fc"/>
                <stop offset=".55" stop-color="#6d8bff"/>
                <stop offset="1" stop-color="#a78bfa"/>
              </linearGradient>
            </defs>
            <path d="M19 3.4 30.6 14.6H7.4Z" fill="url(#ssMarkPopup)"/>
            <path d="M13 28.6 1.4 17.4h23.2Z" fill="url(#ssMarkPopup)" fill-opacity=".58"/>
          </svg>
        </span>
        <span class="brand-text">
          <strong>ShapeShift</strong>
          <span class="brand-version" id="brandVersion">1.0.0</span>
        </span>
      </div>
      <button class="icon-btn" id="optionsBtn" type="button" title="Open settings" aria-label="Open settings">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6h.09A1.65 1.65 0 0 0 10.09 3.09V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
        </svg>
      </button>
    </header>

    <section class="hero" id="heroCard">
      <div class="hero-ring">
        <svg viewBox="0 0 96 96" width="58" height="58" aria-hidden="true">
          <circle class="ring-track" cx="48" cy="48" r="40"/>
          <circle class="ring-progress" id="ringProgress" cx="48" cy="48" r="40"/>
        </svg>
        <span class="hero-score" id="heroScore">100</span>
      </div>
      <div class="hero-copy">
        <span class="status-pill" id="heroPill">
          <span class="dot"></span>
          <span id="heroStatus">Protection active</span>
        </span>
        <h1 id="heroHeadline">Fingerprint is being shaped</h1>
        <p id="heroSub">Deterministic noise is applied to this origin.</p>
      </div>
    </section>

    <section class="panel site-panel">
      <span class="site-glyph" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18Z"/>
        </svg>
      </span>
      <div class="site-meta">
        <span class="micro">Current origin</span>
        <span class="site-host" id="currentSite">loading…</span>
      </div>
      <label class="switch" title="Toggle protection for this site">
        <input type="checkbox" id="siteToggle" checked>
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </label>
    </section>

    <section class="panel matrix-panel">
      <div class="panel-head">
        <h2>Surfaces</h2>
        <span class="counter" id="moduleCounter">0 / 0</span>
      </div>
      <div class="matrix" id="moduleGrid"></div>
    </section>

    <section class="stat-strip">
      <div class="stat">
        <span class="stat-value" id="sitesProtected">0</span>
        <span class="stat-label">Sites shaped</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="totalCalls">0</span>
        <span class="stat-label">Signals intercepted</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="rotationCount">0</span>
        <span class="stat-label">Rotations</span>
      </div>
    </section>

    <section class="rotation" id="rotationSection" hidden>
      <div class="rotation-head">
        <span class="micro">Auto rotation</span>
        <span class="badge" id="rotationStatus">Active</span>
      </div>
      <div class="rotation-body">
        <span class="progress-track"><span class="progress-fill" id="rotationProgress"></span></span>
        <strong id="nextRotation">&mdash;</strong>
      </div>
    </section>

    <section class="actions">
      <button class="btn btn-primary" id="resetBtn" type="button">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
          <path d="M21 3v6h-6"/>
        </svg>
        New identity
      </button>
      <button class="btn btn-ghost" id="optionsBtnSecondary" type="button">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16M4 12h16M4 18h10"/>
        </svg>
        Settings
      </button>
    </section>

    <footer class="footer">
      <span class="footer-note" id="footerNote">Local only · nothing leaves the browser</span>
      <a class="footer-link" href="https://github.com/dinhdidaudo/shapeshift" target="_blank" rel="noreferrer">Repository</a>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../core/config-schema.js"></script>
  <script src="../core/config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
