<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<title>ShapeShift</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="backdrop" aria-hidden="true"><span class="beam"></span><span class="grain"></span></div>
<svg class="ss-defs" width="0" height="0" aria-hidden="true" focusable="false"><defs><linearGradient id="ssRingPopup" x1="8" y1="8" x2="88" y2="88" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5eead4"/><stop offset=".52" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient></defs></svg>
<div class="shell">
<header class="topbar">
<div class="brand">
<span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" width="21" height="21" fill="none"><defs><linearGradient id="ssMarkPopup" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5eead4"/><stop offset=".52" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient></defs><g transform="rotate(45 16 16)"><rect x="7.4" y="7.4" width="17.2" height="17.2" rx="4.6" stroke="url(#ssMarkPopup)" stroke-width="2.6"/></g><circle cx="16" cy="16" r="4.4" fill="url(#ssMarkPopup)"/></svg></span>
<span class="brand-text"><strong>ShapeShift</strong><span class="brand-version" id="brandVersion">v1.0.0</span></span>
</div>
<div class="topbar-actions">
<button class="icon-btn" id="resetBtn" type="button" title="Generate new identity" aria-label="Generate new identity"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 3.5V9H15"/></svg></button>
<button class="icon-btn" id="optionsBtn" type="button" title="Open settings" aria-label="Open settings"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
</div>
</header>
<section class="hero" id="heroCard">
<div class="hero-ring"><svg viewBox="0 0 96 96" width="52" height="52" aria-hidden="true"><circle class="ring-track" cx="48" cy="48" r="40"/><circle class="ring-progress" id="ringProgress" cx="48" cy="48" r="40"/></svg><span class="hero-score" id="heroScore">100</span></div>
<div class="hero-copy"><span class="status-pill" id="heroPill"><span class="dot"></span><span id="heroStatus">Protection active</span></span><h1 id="heroHeadline">Fingerprint is being shaped</h1><p id="heroSub">Deterministic noise is applied to this origin.</p></div>
</section>
<section class="panel site-panel">
<span class="site-glyph" aria-hidden="true"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c4.5 4.7 4.5 12.3 0 17-4.5-4.7-4.5-12.3 0-17Z"/></svg></span>
<div class="site-meta"><span class="micro">Current origin</span><span class="site-host" id="currentSite">loading…</span></div>
<label class="switch" title="Toggle protection for this site"><input type="checkbox" id="siteToggle" checked><span class="switch-track"><span class="switch-thumb"></span></span></label>
</section>
<section class="panel matrix-panel">
<div class="panel-head"><h2>Surfaces</h2><span class="counter" id="moduleCounter">0 / 0</span></div>
<div class="matrix" id="moduleGrid"></div>
</section>
<section class="stat-strip">
<div class="stat"><span class="stat-value" id="sitesProtected">0</span><span class="stat-label">Sites shaped</span></div>
<div class="stat"><span class="stat-value" id="totalCalls">0</span><span class="stat-label">Signals intercepted</span></div>
<div class="stat"><span class="stat-value" id="rotationCount">0</span><span class="stat-label">Rotations</span></div>
</section>
<section class="rotation" id="rotationSection" hidden>
<span class="micro">Auto rotation</span>
<span class="badge" id="rotationStatus">Active</span>
<span class="progress-track"><span class="progress-fill" id="rotationProgress"></span></span>
<strong id="nextRotation">&mdash;</strong>
</section>
<footer class="footer">
<span class="footer-note" id="footerNote">Local only · nothing leaves the browser</span>
<a class="footer-link" href="https://github.com/dinhdidaudo/shapeshift" target="_blank" rel="noreferrer">Repository</a>
</footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="../core/config-schema.js"></script>
<script src="../core/config.js"></script>
<script src="popup.js"></script>
</body>
</html>
